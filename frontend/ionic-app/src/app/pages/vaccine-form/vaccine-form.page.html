<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-button slot="start" fill="clear" (click)="goBack()">
      <ion-icon name="arrow-back"></ion-icon>
    </ion-button>
    <ion-title>New Vaccination</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="form-container">
    <ion-item>
      <ion-label position="floating">Vaccine *</ion-label>
      <ion-select [(ngModel)]="vaccineId" placeholder="Select vaccine">
        <ion-select-option *ngFor="let v of vaccines" [value]="v.id"> {{ v.name }} </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Administration Date *</ion-label>
      <ion-input type="date" [(ngModel)]="administeredAt"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Next Due Date</ion-label>
      <ion-input type="date" [(ngModel)]="nextDueAt"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Veterinarian</ion-label>
      <ion-input type="text" [(ngModel)]="veterinarian"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Batch Number</ion-label>
      <ion-input type="text" [(ngModel)]="batchNumber"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Notes</ion-label>
      <ion-input type="text" [(ngModel)]="notes"></ion-input>
    </ion-item>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <ion-button expand="block" (click)="saveVaccination()" [disabled]="isLoading" class="save-button">
      <ion-spinner *ngIf="isLoading"></ion-spinner>
      <span *ngIf="!isLoading">Save Vaccination</span>
    </ion-button>
  </div>
</ion-content>
