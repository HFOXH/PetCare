<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-button slot="start" fill="clear" (click)="goBack()">
      <ion-icon name="arrow-back"></ion-icon>
    </ion-button>
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="register-container">
    <h2>Create Account</h2>
    <p class="subtitle">Join PetCare today</p>

    <ion-item>
      <ion-icon name="person" slot="start"></ion-icon>
      <ion-label position="floating">Full Name</ion-label>
      <ion-input type="text" [(ngModel)]="fullName" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="mail" slot="start"></ion-icon>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" [(ngModel)]="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="lock-closed" slot="start"></ion-icon>
      <ion-label position="floating">Password</ion-label>
      <ion-input type="password" [(ngModel)]="password" required></ion-input>
    </ion-item>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <ion-button expand="block" (click)="register()" [disabled]="isLoading" class="register-button">
      <ion-spinner *ngIf="isLoading"></ion-spinner>
      <span *ngIf="!isLoading">Create Account</span>
    </ion-button>

    <p class="login-link">
      Already have an account? 
      <a (click)="goBack()">Sign in here</a>
    </p>
  </div>
</ion-content>
