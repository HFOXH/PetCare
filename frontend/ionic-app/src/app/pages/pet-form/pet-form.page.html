<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-button slot="start" fill="clear" (click)="goBack()">
      <ion-icon name="arrow-back"></ion-icon>
    </ion-button>
    <ion-title>{{ isEdit ? 'Edit Pet' : 'New Pet' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="form-container">
    <ion-item>
      <ion-label position="floating">Name *</ion-label>
      <ion-input type="text" [(ngModel)]="name" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Breed</ion-label>
      <ion-input type="text" [(ngModel)]="breed"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Sex</ion-label>
      <ion-select [(ngModel)]="sex" placeholder="Select">
        <ion-select-option value="Male">Male</ion-select-option>
        <ion-select-option value="Female">Female</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Date of Birth</ion-label>
      <ion-input type="date" [(ngModel)]="dateOfBirth"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Weight (kg)</ion-label>
      <ion-input type="number" [(ngModel)]="weight"></ion-input>
    </ion-item>

    <ion-item *ngIf="!isEdit">
      <ion-label position="floating">Species *</ion-label>
      <ion-select [(ngModel)]="speciesId" placeholder="Select species">
        <ion-select-option *ngFor="let s of speciesList" [value]="s.id">
          {{ s.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <ion-button expand="block" (click)="savePet()" [disabled]="isLoading" class="save-button">
      <ion-spinner *ngIf="isLoading"></ion-spinner>
      <span *ngIf="!isLoading">Save Pet</span>
    </ion-button>
  </div>
</ion-content>
