<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Dashboard</ion-title>
    <ion-button slot="end" fill="clear" (click)="logout()">
      Logout
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="dashboard-container">
    <h2>Welcome back!</h2>
    <p class="subtitle">Manage your pets' health</p>

    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-card (click)="goToPets()" class="action-card">
            <ion-card-content>
              <ion-icon name="paw" class="card-icon"></ion-icon>
              <h3>My Pets</h3>
              <p>View and manage your pets</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col size="6">
          <ion-card (click)="goToScan()" class="action-card">
            <ion-card-content>
              <ion-icon name="camera" class="card-icon"></ion-icon>
              <h3>Scan Card</h3>
              <p>Smart scan vaccination cards</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="6">
          <ion-card (click)="goToReminders()" class="action-card">
            <ion-card-content>
              <ion-icon name="calendar" class="card-icon"></ion-icon>
              <h3>Reminders</h3>
              <p>Upcoming vaccines</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col size="6">
          <ion-card class="action-card">
            <ion-card-content>
              <ion-icon name="medical" class="card-icon"></ion-icon>
              <h3>Health</h3>
              <p>Track health records</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
