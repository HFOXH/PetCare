<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <button
    class="theme-toggle-fab"
    type="button"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.dark() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    <ion-icon [name]="theme.dark() ? 'sunny' : 'moon'"></ion-icon>
  </button>
</ion-app>
